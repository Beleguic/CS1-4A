# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: false  # HTTP en développement Docker
        cookie_samesite: lax
        cookie_lifetime: 86400  # 24 heures
        gc_maxlifetime: 86400   # 24 heures
        storage_factory_id: session.storage.factory.native
        save_path: /tmp/sessions
        cookie_httponly: true
        name: 'PLUMBPAY_SESSION'

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        session:
            cookie_secure: true
            cookie_httponly: true
            cookie_lifetime: 86400  # 24 heures en production
            gc_maxlifetime: 86400   # 24 heures en production
